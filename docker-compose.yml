services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-np_note}
      POSTGRES_USER: ${POSTGRES_USER:-np_note}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-np_note}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-np_note}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-not-configured}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-not-configured}
      STORAGE_ROOT: /app/storage
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embeddinggemma}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-10000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-2000}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-52428800}
      PORT: 4000
      HOSTNAME: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - note_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-np_note}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-np_note}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-not-configured}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-not-configured}
      STORAGE_ROOT: /app/storage
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embeddinggemma}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-10000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-2000}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-52428800}
      RUN_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - note_storage:/app/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  note_storage:
  ollama_data:
